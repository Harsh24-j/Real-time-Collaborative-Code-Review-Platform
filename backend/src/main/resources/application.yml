# ========================================
# SPRING BOOT APPLICATION CONFIGURATION
# Skills: Spring Boot, Data Persistence, Secure Coding
# ========================================

spring:
  application:
    name: code-review-platform
  
  # ========================================
  # DATA PERSISTENCE - PostgreSQL Configuration
  # Skill: Data Persistence, J2EE
  # ========================================
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codereview}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    
    # HikariCP Connection Pool
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # ========================================
  # J2EE - JPA/Hibernate Configuration
  # Skill: J2EE, Data Persistence
  # ========================================
  jpa:
    hibernate:
      ddl-auto: update  # Use 'validate' in production with Flyway
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  # ========================================
  # REDIS - Caching & WebSocket Scaling
  # Skill: Server Side, Cloud Deployment
  # ========================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

# ========================================
# SERVER CONFIGURATION
# Skill: Back-End Web Development, Server Side
# ========================================
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# ========================================
# APPLICATION CUSTOM PROPERTIES
# ========================================
app:
  # SECURE CODING - JWT Configuration
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-change-in-production}
    expiration: 86400000  # 24 hours in milliseconds
    issuer: code-review-platform
  
  # AI Integration - OpenAI API
  openai:
    api-key: ${OPENAI_API_KEY:}
    api-url: https://api.openai.com/v1/chat/completions
    model: gpt-4
    max-tokens: 1500
    temperature: 0.3
  
  # SECURE CODING - CORS Configuration
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    exposed-headers: Authorization
    allow-credentials: true
    max-age: 3600

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging:
  level:
    com.codereview: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

# ========================================
# API DOCUMENTATION - Swagger/OpenAPI
# Skill: API, Web Applications
# ========================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# ========================================
# ACTUATOR - Health & Metrics
# ========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
